---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@0e7672a9c96dd4f8483ebb3e882a9e84c599a583
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "rgrim"
      tag: ${{ github.ref_name }}
      apt_packages: >-
        pkg-config
        libegl1-mesa-dev
        libpipewire-0.3-dev
        libgbm-dev
