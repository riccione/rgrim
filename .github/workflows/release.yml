---
name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  release:
    uses: riccione/github-workflows/.github/workflows/rust-release.yml@98a7ac9787f5ce96a088bd2058214a9ce12df2b2
    permissions:
      contents: write
      id-token: write
    with:
      bin_names: "rgrim"
      build_musl: false
      tag: ${{ github.ref_name }}
      apt_packages: >-
        pkg-config
        libegl1-mesa-dev
        libpipewire-0.3-dev
        libgbm-dev
