---
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: riccione/github-workflows/.github/workflows/rust-ci.yml@b27a8bfb3daae371bbd204a6d6555b7f062314f0
    with:
      apt_packages: >-
        pkg-config
        libegl1-mesa-dev
        libpipewire-0.3-dev
        libgbm-dev
