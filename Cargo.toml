[package]
name = "rgrim"
version = "0.1.0"
edition = "2024"
homepage = "https://github.com/riccione/rgrim"
documentation = "https://github.com/riccione/rgrim"
repository = "https://github.com/riccione/rgrim"

[profile.release]
opt-level = 3            # Full optimization (default for release)
lto = true               # Enable Link-Time Optimization across all crates
codegen-units = 1        # Reduce parallel code generation units to maximize LTO impact
panic = "abort"          # Remove panic unwinding overhead (shrinks binary size)
strip = true             # Automatically strip symbols and debug info from the binary

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
chrono = "0.4.44"
dirs = "6.0.0"
eframe = "0.34.2"
image = "0.25.10"
xcap = "0.9.6"
