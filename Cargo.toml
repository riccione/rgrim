[package]
name = "rgrim"
version = "0.4.0"
edition = "2024"
homepage = "https://github.com/riccione/rgrim"
documentation = "https://github.com/riccione/rgrim"
repository = "https://github.com/riccione/rgrim"

[package.metadata.release]
# Prevent cargo-release from trying to upload to crates.io
publish = false

# Customize the automatically generated git commit message
# {{version}} is a placeholder that cargo-release will fill in
pre-release-commit-message = "chore: release v{{version}}"

# Customize the git tag format
tag-name = "v{{version}}"

# Automatically push the commit and the tag to your origin remote
push = false

# Sign the git commit and tag (requires GPG/SSH signing set up in git)
sign-commit = true
sign-tag = true

[profile.release]
opt-level = "z" # Size optimization
lto = true # Enable Link-Time Optimization across all crates
codegen-units = 1 # Reduce parallel code generation units to maximize LTO impact
panic = "abort" # Remove panic unwinding overhead (shrinks binary size)
strip = true # Automatically strip symbols and debug info from the binary

[dependencies]
anyhow = "1.0"
arboard = "3.6"
chrono = "0.4"
dirs = "7.0.0"
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png"] }
xcap = "0.9"
